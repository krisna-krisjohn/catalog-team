<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Biodata Siswa</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { 
      background: linear-gradient(135deg, #203837, #304d47 52%, #40584d); 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      padding: 20px; 
    }
    .container { background-color: #f2f1e8; padding: 30px; border-radius: 12px; box-shadow: 0 8px 24px rgba(8, 23, 22, 0.28); width: 100%; max-width: 500px; }
    h2 { color: #293e3b; margin-bottom: 20px; text-align: center; }
    .form-group { margin-bottom: 16px; }
    .form-row { display: flex; gap: 16px; }
    .form-row .form-group { flex: 1; }
    label { display: block; font-weight: 600; font-size: 14px; color: #485d55; margin-bottom: 6px; }
    input[type="text"], input[type="number"], input[type="tel"], select { width: 100%; padding: 10px 12px; border: 1.5px solid #cbd4cc; border-radius: 6px; font-size: 14px; outline: none; background: #fbfaf4; color: #293e3b; }
    input:focus, select:focus { border-color: #718265; box-shadow: 0 0 0 3px rgba(113, 130, 101, 0.2); }
    .radio-group { display: flex; gap: 20px; margin-top: 6px; }
    .radio-option { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .btn-submit { width: 100%; background: #a85d58; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
    .btn-submit:hover { background: #8c4845; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Form Biodata Siswa</h2>
    <form id="biodataForm">
      <div class="form-group">
        <label for="NLENGKAP">Nama Lengkap</label>
        <input type="text" id="NLENGKAP" name="NLENGKAP" placeholder="Masukkan nama lengkap" required>
      </div>
      <div class="form-group">
        <label for="ALAMAT">Alamat Lengkap</label>
        <input type="text" id="ALAMAT" name="ALAMAT" placeholder="Masukkan alamat tempat tinggal" required>
      </div>
      <div class="form-group">
        <label for="JURUSAN">Jurusan</label>
        <select name="JURUSAN" id="JURUSAN" required>
          <option value="" disabled selected>-- Pilih Jurusan --</option>
          <option value="RPL - Rekayasa Perangkat Lunak">RPL - Rekayasa Perangkat Lunak</option>
          <option value="TEI - Teknik Elektronika Industri">TEI - Teknik Elektronika Industri</option>
          <option value="TKR - Teknik Kendaraan Ringan">TKR - Teknik Kendaraan Ringan</option>
          <option value="TSM - Teknik Sepeda Motor">TSM - Teknik Sepeda Motor</option>
          <option value="TKJ - Teknik Komputer & Jaringan">TKJ - Teknik Komputer & Jaringan</option>    
        </select>
      </div>
      <div class="form-group">
        <label>Jenis Kelamin</label>
        <div class="radio-group">
          <label class="radio-option">
            <input type="radio" id="L" name="JENIS_KELAMIN" value="LAKI-LAKI" required>
            Laki-laki
          </label>
          <label class="radio-option">
            <input type="radio" id="P" name="JENIS_KELAMIN" value="PEREMPUAN">
            Perempuan
          </label>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="TB">Tinggi Badan (cm)</label>
          <input type="number" id="TB" name="TB" placeholder="170" min="50" max="250">
        </div>
        <div class="form-group">
          <label for="BB">Berat Badan (kg)</label>
          <input type="number" id="BB" name="BB" placeholder="60" min="10" max="300">
        </div>
      </div>
      <div class="form-group">
        <label for="HOBI">Hobi</label>
        <input type="text" id="HOBI" name="HOBI" placeholder="Membaca, Olahraga, dll.">
      </div>
      <div class="form-group">
        <label for="NOHP">No. Handphone (+62)</label>
        <input type="tel" id="NOHP" name="NOHP" placeholder="081234567890" maxlength="12" pattern="[0-9+]+" title="Hanya masukkan angka atau tanda + (maksimal 12 karakter)">
      </div>
      <button type="submit" class="btn-submit">Simpan & Pindah Halaman</button>
    </form>
  </div>
  <script>
    document.getElementById('biodataForm').addEventListener('submit', function(event) {
      event.preventDefault();
      const jkInput = document.querySelector('input[name="JENIS_KELAMIN"]:checked');
      const dataSiswa = {
        nama: document.getElementById('NLENGKAP').value,
        alamat: document.getElementById('ALAMAT').value,
        jurusan: document.getElementById('JURUSAN').value,
        jk: jkInput ? jkInput.value : '-',
        tb: document.getElementById('TB').value || '-',
        bb: document.getElementById('BB').value || '-',
        hobi: document.getElementById('HOBI').value || '-',
        nohp: document.getElementById('NOHP').value || '-'
      };
      localStorage.setItem('biodataSiswa', JSON.stringify(dataSiswa));
      window.location.href = 'hasil.html';
    });
  </script>
</body>
</html>
